name: ASC finalize ready X5 release

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 10
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - run: python -m pip install --require-hashes -r .github/requirements/asc-requirements.lock

      - name: Verify build 230 and submit the existing ready review
        run: python scripts/asc_submit_credit_packs.py --action submit

      - name: Release automatically after Apple approval
        run: python scripts/asc_set_after_approval.py
