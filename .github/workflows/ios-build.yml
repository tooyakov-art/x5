name: iOS build & TestFlight upload

on:
  push:
    branches: [main, codex/x5-cleanup-from-restore-clean]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      SCHEME: X5
      BUNDLE_ID: com.x5studio.app
      ARCHIVE_PATH: ${{ github.workspace }}/build/X5.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # ── КЕШ: Swift Package Manager + DerivedData ──
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/**/.build
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache DerivedData (Xcode build artifacts)
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('X5/**/*.swift', 'project.yml') }}
          restore-keys: |
            derived-${{ runner.os }}-

      # ── Подготовка проекта (параллельно с кешем выше) ──
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up signing keychain
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          P12_PASSWORD_CLEAN=$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD_CLEAN" -f pkcs12 -A -t cert
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<<"$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed profile UUID: $UUID"

      - name: Resolve provisioning profile name
        id: profile
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<<"$(security cms -D -i "$PROFILE_PATH")")
          echo "Using profile: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Patch ExportOptions.plist with profile name
        run: |
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:${BUNDLE_ID} '${{ steps.profile.outputs.name }}'" ExportOptions.plist

      - name: Write Release.xcconfig with profile name
        run: |
          cat > Release.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${{ steps.profile.outputs.name }}
          DEVELOPMENT_TEAM = F8LA8PC4U6
          OTHER_CODE_SIGN_FLAGS = --keychain $RUNNER_TEMP/build.keychain-db
          ENABLE_ON_DEMAND_RESOURCES = NO
          ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS = NO
          EOF

      - name: Build & archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project X5.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: X5-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          P8_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$P8_PATH"
          mkdir -p ./private_keys
          cp "$P8_PATH" ./private_keys/

      - name: Resolve App Store Connect provider
        id: provider
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          PROVIDERS_JSON="$RUNNER_TEMP/providers.json"
          xcrun altool --list-providers \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --output-format json > "$PROVIDERS_JSON"

          PROVIDER_PUBLIC_ID=$(python3 - "$PROVIDERS_JSON" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8", errors="ignore")
          match = re.search(r"(\{.*\})", raw, re.S)
          if not match:
              raise SystemExit(f"Could not parse altool provider JSON:\n{raw[:2000]}")
          payload = json.loads(match.group(1))

          candidates = []
          def walk(node):
              if isinstance(node, dict):
                  value = None
                  for key, item in node.items():
                      lowered = key.lower()
                      if "provider" in lowered and "public" in lowered and "id" in lowered:
                          value = str(item)
                          break
                      if lowered in {"providerpublicid", "provider_public_id"}:
                          value = str(item)
                          break
                  if value:
                      candidates.append(value)
                  for item in node.values():
                      walk(item)
              elif isinstance(node, list):
                  for item in node:
                      walk(item)
          walk(payload)

          seen = []
          for candidate in candidates:
              if candidate and candidate not in seen:
                  seen.append(candidate)

          if not seen:
              raise SystemExit(f"No provider public ids found in:\n{json.dumps(payload, indent=2)[:4000]}")

          if len(seen) == 1:
              print(seen[0])
              raise SystemExit(0)

          api_key = os.environ["ASC_API_KEY_ID"]
          api_issuer = os.environ["ASC_API_ISSUER_ID"]
          bundle_id = os.environ["BUNDLE_ID"]
          for provider in seen:
              cmd = [
                  "xcrun", "altool", "--list-apps",
                  "--provider-public-id", provider,
                  "--filter-bundle-id", bundle_id,
                  "--apiKey", api_key,
                  "--apiIssuer", api_issuer,
                  "--output-format", "json",
              ]
              result = subprocess.run(cmd, capture_output=True, text=True)
              combined = result.stdout + "\n" + result.stderr
              if result.returncode == 0 and (bundle_id in combined or "6764340680" in combined):
                  print(provider)
                  raise SystemExit(0)

          raise SystemExit(f"No provider contained {bundle_id}. Providers: {seen}")
          PY
          )

          echo "Resolved provider public id: $PROVIDER_PUBLIC_ID"
          echo "provider_public_id=$PROVIDER_PUBLIC_ID" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          PROVIDER_PUBLIC_ID: ${{ steps.provider.outputs.provider_public_id }}
        run: |
          set -euo pipefail
          IPA=$(ls "$EXPORT_PATH"/*.ipa | head -n 1)
          LOG="$RUNNER_TEMP/altool-upload.log"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --provider-public-id "$PROVIDER_PUBLIC_ID" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" 2>&1 | tee "$LOG"
          if grep -E "UPLOAD FAILED|Failed to upload package|STATE_ERROR|Validation failed" "$LOG"; then
            exit 1
          fi
