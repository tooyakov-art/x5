name: ASC recover fixed Sandbox consumables

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x5-fixed-sandbox-consumable-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IAP_API_KEY_ID: ${{ secrets.IAP_API_KEY_ID || secrets.ASC_API_KEY_ID }}
      IAP_API_ISSUER_ID: ${{ secrets.IAP_API_ISSUER_ID || secrets.ASC_API_ISSUER_ID }}
      IAP_API_KEY_BASE64: ${{ secrets.IAP_API_KEY_BASE64 || secrets.ASC_API_KEY_BASE64 }}

    steps:
      - name: Check out the audited revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned recovery dependencies
        run: >-
          python -m pip install
          'PyJWT[crypto]==2.10.1'
          'requests==2.32.5'

      - name: Verify the fixed recovery contract
        run: python -m unittest scripts.tests.test_apple_sandbox_consumable_recovery

      - name: Recover the two fixed Sandbox consumables
        run: python -m scripts.apple_sandbox_consumable_recovery
