name: ASC configure credit store

on:
  workflow_dispatch:
    inputs:
      credit_review_action:
        description: "Audit only, or submit READY_TO_SUBMIT credit packs"
        required: true
        type: choice
        default: audit
        options:
          - audit
          - submit
  push:
    branches: [main, codex/x5-course-client-fixes-20260714]
    paths:
      - ".github/workflows/asc-configure-credit-store.yml"
      - "scripts/asc_configure_credit_store.py"
      - "fastlane/iap-screenshots/x5-credit-store-review.png"

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyjwt[crypto] requests
      - name: Verify configuration contract
        run: python -m unittest discover -s scripts/tests -p "test_asc_configure_credit_store.py"
      - name: Configure consumable credit packs
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          SCREENSHOT_PATH: fastlane/iap-screenshots/x5-credit-store-review.png
        run: python scripts/asc_configure_credit_store.py
      - name: Verify server notification contract
        run: >-
          python -m unittest discover -s scripts/tests
          -p "test_asc_configure_server_notifications.py"
      - name: Configure App Store server notifications
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          APP_STORE_NOTIFICATIONS_URL: >-
            https://afwznqjpshybmqhlewmy.supabase.co/functions/v1/app-store-notifications
        run: python scripts/asc_configure_server_notifications.py
      - name: Verify guarded credit review contract
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: >-
          python -m unittest discover -s scripts/tests
          -p "test_asc_submit_credit_packs.py"
      - name: Audit or submit credit packs for App Review
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: >-
          python scripts/asc_submit_credit_packs.py
          --action "${{ inputs.credit_review_action }}"
