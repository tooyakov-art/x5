name: iOS course regression tests

on:
  push:
    branches:
      - codex/x5-course-client-fixes-20260714
  pull_request:
    paths:
      - "X5/**"
      - "X5Tests/**"
      - "project.yml"
      - ".github/workflows/ios-course-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-course-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Using iPhone simulator $DEVICE_ID"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project X5.xcodeproj \
            -scheme X5-Course-CI \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
