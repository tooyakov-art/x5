name: ASC configure subscriptions

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUNDLE_ID: com.x5studio.app
      SCREENSHOT_PATH: fastlane/iap-screenshots/x5-pro-monthly.jpg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyjwt[crypto] requests
      - name: Configure App Store Connect subscriptions
        run: |
          python <<'PY'
          import base64
          import hashlib
          import mimetypes
          import os
          import sys
          import time
          from decimal import Decimal

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"

          PRODUCTS = [
              {
                  "key": "lite",
                  "name": "X5 Lite Monthly",
                  "product_id": "com.x5studio.app.lite.monthly",
                  "display_name": "X5 Lite",
                  "description": "Monthly access to X5 creator tools, Hub, courses, and 500 credits.",
                  "price_kaz": Decimal("1000"),
                  "group_level": 2,
                  "review_note": "Lite monthly plan shown in the app paywall. User gets paid access and 500 credits.",
              },
              {
                  "key": "pro",
                  "name": "X5 Pro Monthly",
                  "product_id": "com.x5studio.app.pro.monthly",
                  "display_name": "X5 Pro",
                  "description": "Monthly access to all X5 AI tools, premium courses, Hub, priority support, and 2000 credits.",
                  "price_kaz": Decimal("2000"),
                  "group_level": 1,
                  "review_note": "Pro monthly plan shown in the app paywall. User gets full paid access and 2000 credits.",
              },
          ]

          def make_token():
              return jwt.encode(
                  {
                      "iss": os.environ["ASC_API_ISSUER_ID"],
                      "iat": int(time.time()),
                      "exp": int(time.time()) + 60 * 10,
                      "aud": "appstoreconnect-v1",
                  },
                  base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
                  algorithm="ES256",
                  headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
              )

          TOKEN = make_token()

          def headers():
              return {"Authorization": f"Bearer {TOKEN}"}

          def api(method, path, *, expected=(200,), **kwargs):
              url = path if path.startswith("http") else f"{BASE}{path}"
              req_headers = headers()
              if "json" in kwargs:
                  req_headers["Content-Type"] = "application/json"
              req_headers.update(kwargs.pop("headers", {}))
              response = requests.request(method, url, headers=req_headers, timeout=60, **kwargs)
              if response.status_code not in expected:
                  print(f"{method} {url} -> HTTP {response.status_code}")
                  print(response.text[:2000])
                  raise SystemExit(1)
              if response.text:
                  return response.json()
              return None

          def list_all(path):
              rows = []
              url = f"{BASE}{path}"
              while url:
                  response = requests.get(url, headers=headers(), timeout=60)
                  if response.status_code >= 300:
                      print(f"GET {url} -> HTTP {response.status_code}")
                      print(response.text[:2000])
                      raise SystemExit(1)
                  payload = response.json()
                  rows.extend(payload.get("data", []))
                  url = payload.get("links", {}).get("next")
              return rows

          def money(value):
              return Decimal(str(value)).quantize(Decimal("0.01"))

          app = api("GET", f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}")["data"]
          if not app:
              raise SystemExit(f"No App Store Connect app for {os.environ['BUNDLE_ID']}")
          app_id = app[0]["id"]
          print(f"App: {app_id} ({os.environ['BUNDLE_ID']})")

          group_links = list_all(f"/apps/{app_id}/relationships/subscriptionGroups?limit=200")
          groups = [api("GET", f"/subscriptionGroups/{item['id']}")["data"] for item in group_links]
          group = next((g for g in groups if g.get("attributes", {}).get("referenceName") == "X5 Subscriptions"), None)
          if not group and groups:
              group = groups[0]
              print(f"Using existing subscription group: {group['id']} {group.get('attributes', {}).get('referenceName')}")
          if not group:
              group = api(
                  "POST",
                  "/subscriptionGroups",
                  expected=(201,),
                  json={
                      "data": {
                          "type": "subscriptionGroups",
                          "attributes": {"referenceName": "X5 Subscriptions"},
                          "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                      }
                  },
              )["data"]
              print(f"Created subscription group: {group['id']}")
          group_id = group["id"]

          group_localizations = list_all(f"/subscriptionGroups/{group_id}/subscriptionGroupLocalizations?limit=200")
          en_group_loc = next((loc for loc in group_localizations if loc["attributes"].get("locale") == "en-US"), None)
          group_loc_payload = {
              "data": {
                  "type": "subscriptionGroupLocalizations",
                  "attributes": {"name": "X5 subscriptions", "locale": "en-US"},
                  "relationships": {"subscriptionGroup": {"data": {"type": "subscriptionGroups", "id": group_id}}},
              }
          }
          if en_group_loc:
              print("Subscription group localization en-US exists, keeping existing name")
          else:
              api("POST", "/subscriptionGroupLocalizations", expected=(201,), json=group_loc_payload)
              print("Created subscription group localization en-US")

          existing_subs = list_all(f"/subscriptionGroups/{group_id}/subscriptions?limit=200")
          by_product = {sub["attributes"].get("productId"): sub for sub in existing_subs}
          configured = []

          for spec in PRODUCTS:
              sub = by_product.get(spec["product_id"])
              if sub:
                  sub_id = sub["id"]
                  api(
                      "PATCH",
                      f"/subscriptions/{sub_id}",
                      json={
                          "data": {
                              "type": "subscriptions",
                              "id": sub_id,
                              "attributes": {
                                  "name": spec["name"],
                                  "reviewNote": spec["review_note"],
                                  "groupLevel": spec["group_level"],
                                  "familySharable": False,
                                  "availableInAllTerritories": True,
                              },
                          }
                      },
                  )
                  print(f"Updated subscription: {spec['product_id']} -> {sub_id}")
              else:
                  sub = api(
                      "POST",
                      "/subscriptions",
                      expected=(201,),
                      json={
                          "data": {
                              "type": "subscriptions",
                              "attributes": {
                                  "name": spec["name"],
                                  "productId": spec["product_id"],
                                  "subscriptionPeriod": "ONE_MONTH",
                                  "familySharable": False,
                                  "reviewNote": spec["review_note"],
                                  "groupLevel": spec["group_level"],
                                  "availableInAllTerritories": True,
                              },
                              "relationships": {
                                  "group": {"data": {"type": "subscriptionGroups", "id": group_id}}
                              },
                          }
                      },
                  )["data"]
                  sub_id = sub["id"]
                  print(f"Created subscription: {spec['product_id']} -> {sub_id}")

              localizations = list_all(f"/subscriptions/{sub_id}/subscriptionLocalizations?limit=200")
              en_loc = next((loc for loc in localizations if loc["attributes"].get("locale") == "en-US"), None)
              if en_loc:
                  api(
                      "PATCH",
                      f"/subscriptionLocalizations/{en_loc['id']}",
                      json={
                          "data": {
                              "type": "subscriptionLocalizations",
                              "id": en_loc["id"],
                              "attributes": {
                                  "name": spec["display_name"],
                                  "description": spec["description"],
                              },
                          }
                      },
                  )
                  print(f"Updated localization en-US for {spec['product_id']}")
              else:
                  api(
                      "POST",
                      "/subscriptionLocalizations",
                      expected=(201,),
                      json={
                          "data": {
                              "type": "subscriptionLocalizations",
                              "attributes": {
                                  "name": spec["display_name"],
                                  "locale": "en-US",
                                  "description": spec["description"],
                              },
                              "relationships": {
                                  "subscription": {"data": {"type": "subscriptions", "id": sub_id}}
                              },
                          }
                      },
                  )
                  print(f"Created localization en-US for {spec['product_id']}")

              price_points = list_all(
                  f"/subscriptions/{sub_id}/pricePoints?include=territory&filter[territory]=KAZ&limit=8000"
              )
              exact = [
                  point
                  for point in price_points
                  if money(point["attributes"].get("customerPrice")) == spec["price_kaz"].quantize(Decimal("0.01"))
              ]
              if not exact:
                  sample = ", ".join(str(p["attributes"].get("customerPrice")) for p in price_points[:20])
                  raise SystemExit(
                      f"No exact KAZ price point {spec['price_kaz']} for {spec['product_id']}. First values: {sample}"
                  )
              price_point_id = exact[0]["id"]
              prices = list_all(f"/subscriptions/{sub_id}/prices?include=subscriptionPricePoint,territory&filter[territory]=KAZ&limit=200")
              current_price_point_ids = {
                  price.get("relationships", {}).get("subscriptionPricePoint", {}).get("data", {}).get("id")
                  for price in prices
              }
              if price_point_id in current_price_point_ids:
                  print(f"KAZ price already set for {spec['product_id']}: {spec['price_kaz']} KZT")
              else:
                  api(
                      "POST",
                      "/subscriptionPrices",
                      expected=(201,),
                      json={
                          "data": {
                              "type": "subscriptionPrices",
                              "attributes": {"startDate": None},
                              "relationships": {
                                  "subscription": {"data": {"type": "subscriptions", "id": sub_id}},
                                  "subscriptionPricePoint": {
                                      "data": {"type": "subscriptionPricePoints", "id": price_point_id}
                                  },
                              },
                          }
                      },
                  )
                  print(f"Set KAZ price for {spec['product_id']}: {spec['price_kaz']} KZT")

              configured.append((spec, sub_id))

          screenshot_path = os.environ["SCREENSHOT_PATH"]
          if os.path.exists(screenshot_path):
              with open(screenshot_path, "rb") as f:
                  data = f.read()
              checksum = hashlib.md5(data).hexdigest()
              size = len(data)
              filename = os.path.basename(screenshot_path)
              mime = mimetypes.guess_type(filename)[0] or "image/jpeg"
              print(f"Review screenshot: {filename} size={size} md5={checksum} mime={mime}")

              for spec, sub_id in configured:
                  reservation = api(
                      "POST",
                      "/subscriptionAppStoreReviewScreenshots",
                      expected=(201,),
                      json={
                          "data": {
                              "type": "subscriptionAppStoreReviewScreenshots",
                              "attributes": {"fileName": filename, "fileSize": size},
                              "relationships": {
                                  "subscription": {"data": {"type": "subscriptions", "id": sub_id}}
                              },
                          }
                      },
                  )["data"]
                  asset_id = reservation["id"]
                  for op in reservation["attributes"]["uploadOperations"]:
                      chunk = data[op["offset"] : op["offset"] + op["length"]]
                      upload_headers = {h["name"]: h["value"] for h in op["requestHeaders"]}
                      up = requests.request(op["method"], op["url"], headers=upload_headers, data=chunk, timeout=60)
                      if up.status_code >= 300:
                          print(f"Screenshot upload failed HTTP {up.status_code}: {up.text[:1000]}")
                          raise SystemExit(1)
                  api(
                      "PATCH",
                      f"/subscriptionAppStoreReviewScreenshots/{asset_id}",
                      json={
                          "data": {
                              "type": "subscriptionAppStoreReviewScreenshots",
                              "id": asset_id,
                              "attributes": {"uploaded": True, "sourceFileChecksum": checksum},
                          }
                      },
                  )
                  print(f"Uploaded review screenshot for {spec['product_id']} -> {asset_id}")
          else:
              print(f"Review screenshot not found, skipped: {screenshot_path}")

          print("Configured subscriptions:")
          for spec, sub_id in configured:
              print(f"  {spec['product_id']} -> {sub_id}, {spec['price_kaz']} KZT")
          PY
