name: ASC release prepare

on:
  workflow_dispatch:
  push:
    branches: [codex/x5-cleanup-from-restore-clean]
    paths:
      - ".github/workflows/asc-release-prepare.yml"

jobs:
  prepare:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUNDLE_ID: com.x5studio.app
      VERSION: "1.1.4"
      BUILD_NUMBER: "177"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyjwt[crypto] requests

      - name: Ensure App Store version exists
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import sys
          import time

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"

          def make_token():
              return jwt.encode(
                  {
                      "iss": os.environ["ASC_API_ISSUER_ID"],
                      "iat": int(time.time()),
                      "exp": int(time.time()) + 600,
                      "aud": "appstoreconnect-v1",
                  },
                  base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
                  algorithm="ES256",
                  headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
              )

          h = {"Authorization": f"Bearer {make_token()}"}
          app = requests.get(f"{BASE}/apps?filter[bundleId]={os.environ['BUNDLE_ID']}", headers=h)
          app.raise_for_status()
          app_id = app.json()["data"][0]["id"]
          print(f"App: {app_id}")

          versions = requests.get(f"{BASE}/apps/{app_id}/appStoreVersions", headers=h)
          versions.raise_for_status()
          for version in versions.json().get("data", []):
              attrs = version["attributes"]
              print(f"Existing: {attrs.get('versionString')} {attrs.get('platform')} {attrs.get('appStoreState')}")
              if attrs.get("versionString") == os.environ["VERSION"] and attrs.get("platform") == "IOS":
                  print(f"Version {os.environ['VERSION']} already exists: {version['id']}")
                  sys.exit(0)

          payload = {
              "data": {
                  "type": "appStoreVersions",
                  "attributes": {
                      "platform": "IOS",
                      "versionString": os.environ["VERSION"],
                  },
                  "relationships": {
                      "app": {"data": {"type": "apps", "id": app_id}}
                  },
              }
          }
          created = requests.post(
              f"{BASE}/appStoreVersions",
              headers={**h, "Content-Type": "application/json"},
              data=json.dumps(payload),
          )
          if created.status_code >= 300:
              print(f"Create version failed HTTP {created.status_code}: {created.text}")
              sys.exit(1)
          row = created.json()["data"]
          print(f"Created version {row['id']} state={row['attributes'].get('appStoreState')}")
          PY

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Upload App Store metadata and screenshots
        run: fastlane ios upload

      - name: Attach TestFlight build to App Store version
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import sys
          import time

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"

          token = jwt.encode(
              {
                  "iss": os.environ["ASC_API_ISSUER_ID"],
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 600,
                  "aud": "appstoreconnect-v1",
              },
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          h = {"Authorization": f"Bearer {token}"}

          app = requests.get(f"{BASE}/apps?filter[bundleId]={os.environ['BUNDLE_ID']}", headers=h)
          app.raise_for_status()
          app_id = app.json()["data"][0]["id"]

          versions = requests.get(f"{BASE}/apps/{app_id}/appStoreVersions", headers=h)
          versions.raise_for_status()
          version = next(
              (
                  v for v in versions.json().get("data", [])
                  if v["attributes"].get("versionString") == os.environ["VERSION"]
                  and v["attributes"].get("platform") == "IOS"
              ),
              None,
          )
          if not version:
              sys.exit(f"No version {os.environ['VERSION']}")
          version_id = version["id"]
          print(f"Version {os.environ['VERSION']}: {version_id} state={version['attributes'].get('appStoreState')}")

          builds = requests.get(
              f"{BASE}/builds",
              headers=h,
              params={
                  "filter[app]": app_id,
                  "filter[preReleaseVersion.platform]": "IOS",
                  "limit": 200,
                  "sort": "-uploadedDate",
              },
          )
          builds.raise_for_status()
          build = next(
              (
                  b for b in builds.json().get("data", [])
                  if b["attributes"].get("version") == os.environ["BUILD_NUMBER"]
              ),
              None,
          )
          if not build:
              sys.exit(f"No build {os.environ['BUILD_NUMBER']}")
          attrs = build["attributes"]
          print(f"Build {attrs.get('version')}: {build['id']} state={attrs.get('processingState')} expired={attrs.get('expired')}")
          if attrs.get("processingState") != "VALID" or attrs.get("expired"):
              sys.exit("Build is not attachable")

          response = requests.patch(
              f"{BASE}/appStoreVersions/{version_id}/relationships/build",
              headers={**h, "Content-Type": "application/json"},
              data=json.dumps({"data": {"type": "builds", "id": build["id"]}}),
          )
          if response.status_code >= 300:
              print(f"Attach failed HTTP {response.status_code}: {response.text}")
              sys.exit(1)
          print("Attached build.")
          PY
