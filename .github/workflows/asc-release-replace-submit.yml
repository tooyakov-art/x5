name: ASC replace pending release with latest build

on:
  workflow_dispatch:
  push:
    branches: [codex/x5-cleanup-from-restore-clean]
    paths:
      - ".github/workflows/asc-release-replace-submit.yml"
      - "fastlane/metadata/review_information/notes.txt"

jobs:
  replace-submit:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      BUNDLE_ID: com.x5studio.app
      EXPECTED_VERSION: "1.1.2"
      EXPECTED_BUILD: "167"
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: gem install fastlane -N
      - run: pip install pyjwt[crypto] requests

      - name: Stamp latest build in review notes
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("fastlane/metadata/review_information/notes.txt")
          text = path.read_text(encoding="utf-8")
          text = text.replace("build 163", f"build {os.environ['EXPECTED_BUILD']}")
          path.write_text(text, encoding="utf-8")
          print(f"Review notes stamped for build {os.environ['EXPECTED_BUILD']}")
          PY

      - name: Developer-reject pending App Store version when replacing old build
        run: |
          ruby <<'RUBY'
          require "base64"
          require "spaceship"

          token = Spaceship::ConnectAPI::Token.create(
            key_id: ENV.fetch("ASC_API_KEY_ID"),
            issuer_id: ENV.fetch("ASC_API_ISSUER_ID"),
            key: Base64.decode64(ENV.fetch("ASC_API_KEY_BASE64"))
          )
          Spaceship::ConnectAPI.token = token

          app = Spaceship::ConnectAPI::App.find(ENV.fetch("BUNDLE_ID"))
          version = app.get_app_store_versions(
            filter: { platform: "IOS" },
            includes: "appStoreVersionSubmission"
          ).find do |row|
            row.version_string == ENV.fetch("EXPECTED_VERSION")
          end
          abort "No iOS version #{ENV.fetch("EXPECTED_VERSION")}" unless version

          puts "Version #{version.version_string}: #{version.id} state=#{version.app_store_state}"
          if version.app_store_state == "PENDING_DEVELOPER_RELEASE"
            puts "Developer-rejecting pending release so build #{ENV.fetch("EXPECTED_BUILD")} can be attached."
            if version.can_reject?
              abort "Developer reject returned false." unless version.reject!
              puts "Developer rejected."
            else
              puts "ASC does not expose a rejectable submission for this pending release; will try direct build replacement with rollback."
            end
          elsif ["PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "READY_FOR_REVIEW"].include?(version.app_store_state)
            puts "Version is editable/submittable; no developer reject needed."
          elsif ["WAITING_FOR_REVIEW", "IN_REVIEW"].include?(version.app_store_state)
            abort "Version is already in Apple review; do not replace while state=#{version.app_store_state}"
          elsif version.app_store_state == "READY_FOR_SALE"
            abort "Version is already live; create a new marketing version instead."
          else
            abort "Version state is not safe to replace: #{version.app_store_state}"
          end
          RUBY

      - name: Upload latest review metadata
        continue-on-error: true
        run: fastlane ios upload

      - name: Attach build and submit for review
        run: |
          python <<'PY'
          import base64
          import os
          import sys
          import time

          import jwt
          import requests

          BASE = "https://api.appstoreconnect.apple.com/v1"
          READY_TO_SUBMIT = {"PREPARE_FOR_SUBMISSION", "READY_FOR_REVIEW", "DEVELOPER_REJECTED", "REJECTED"}
          PENDING_RELEASE = "PENDING_DEVELOPER_RELEASE"

          token = jwt.encode(
              {
                  "iss": os.environ["ASC_API_ISSUER_ID"],
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 600,
                  "aud": "appstoreconnect-v1",
              },
              base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}"}
          json_headers = {**headers, "Content-Type": "application/json"}

          def api(method, path, expected=(200,), **kwargs):
              url = path if path.startswith("http") else f"{BASE}{path}"
              response = requests.request(method, url, headers=headers, timeout=60, **kwargs)
              if response.status_code not in expected:
                  print(f"{method} {url} -> HTTP {response.status_code}")
                  print(response.text[:3000])
                  raise SystemExit(1)
              return response.json() if response.text else {}

          def json_api(method, path, payload, expected=(200,)):
              url = path if path.startswith("http") else f"{BASE}{path}"
              response = requests.request(method, url, headers=json_headers, json=payload, timeout=60)
              if response.status_code not in expected:
                  print(f"{method} {url} -> HTTP {response.status_code}")
                  print(response.text[:3000])
                  raise SystemExit(1)
              return response.json() if response.text else {}

          def list_all(path):
              rows = []
              url = f"{BASE}{path}"
              while url:
                  response = requests.get(url, headers=headers, timeout=60)
                  if response.status_code >= 300:
                      print(f"GET {url} -> HTTP {response.status_code}")
                      print(response.text[:3000])
                      raise SystemExit(1)
                  payload = response.json()
                  rows.extend(payload.get("data", []))
                  url = payload.get("links", {}).get("next")
              return rows

          app_rows = api("GET", f"/apps?filter[bundleId]={os.environ['BUNDLE_ID']}").get("data", [])
          if not app_rows:
              sys.exit(f"No ASC app found for {os.environ['BUNDLE_ID']}")
          app_id = app_rows[0]["id"]
          print(f"App: {app_id}")

          versions = list_all(f"/apps/{app_id}/appStoreVersions?limit=50")
          version = next(
              (
                  row for row in versions
                  if row.get("attributes", {}).get("versionString") == os.environ["EXPECTED_VERSION"]
                  and row.get("attributes", {}).get("platform") == "IOS"
              ),
              None,
          )
          if not version:
              sys.exit(f"No iOS AppStoreVersion {os.environ['EXPECTED_VERSION']}")
          version_id = version["id"]
          version_state = version["attributes"].get("appStoreState")
          print(f"Version {os.environ['EXPECTED_VERSION']}: {version_id} state={version_state}")
          if version_state not in READY_TO_SUBMIT and version_state != PENDING_RELEASE:
              sys.exit(f"Version is not editable/submittable after reject/upload: {version_state}")

          previous = api("GET", f"/appStoreVersions/{version_id}/build").get("data")
          previous_build_id = previous["id"] if previous else None
          previous_build_version = previous.get("attributes", {}).get("version") if previous else None
          print(f"Previously attached build: id={previous_build_id} version={previous_build_version}")

          build = None
          for attempt in range(1, 31):
              builds = list_all(f"/builds?filter[app]={app_id}&filter[preReleaseVersion.platform]=IOS&limit=200&sort=-uploadedDate")
              build = next(
                  (
                      row for row in builds
                      if row.get("attributes", {}).get("version") == os.environ["EXPECTED_BUILD"]
                  ),
                  None,
              )
              if build:
                  attrs = build.get("attributes", {})
                  print(
                      f"Build {os.environ['EXPECTED_BUILD']}: id={build['id']} "
                      f"state={attrs.get('processingState')} expired={attrs.get('expired')}"
                  )
                  if attrs.get("processingState") == "VALID" and not attrs.get("expired"):
                      break
              print(f"Build {os.environ['EXPECTED_BUILD']} is not VALID yet; wait attempt {attempt}/30")
              time.sleep(30)
          else:
              sys.exit(f"Build {os.environ['EXPECTED_BUILD']} is not VALID in App Store Connect")

          json_api(
              "PATCH",
              f"/appStoreVersions/{version_id}/relationships/build",
              {"data": {"type": "builds", "id": build["id"]}},
              expected=(200, 204),
          )
          print(f"Attached build {os.environ['EXPECTED_BUILD']} to version {os.environ['EXPECTED_VERSION']}.")

          def restore_previous_build(reason):
              if previous_build_id and previous_build_id != build["id"]:
                  print(f"{reason}; restoring previous build {previous_build_version} ({previous_build_id}).")
                  json_api(
                      "PATCH",
                      f"/appStoreVersions/{version_id}/relationships/build",
                      {"data": {"type": "builds", "id": previous_build_id}},
                      expected=(200, 204),
                  )
              sys.exit(reason)

          attached = api("GET", f"/appStoreVersions/{version_id}/build").get("data")
          if not attached:
              sys.exit("No build attached after PATCH")
          attached_attrs = attached.get("attributes", {})
          print(f"Attached verification: build={attached_attrs.get('version')} state={attached_attrs.get('processingState')}")
          if attached_attrs.get("version") != os.environ["EXPECTED_BUILD"]:
              sys.exit(f"Wrong build attached: {attached_attrs.get('version')}")

          refreshed_versions = list_all(f"/apps/{app_id}/appStoreVersions?limit=50")
          refreshed = next(row for row in refreshed_versions if row["id"] == version_id)
          refreshed_state = refreshed["attributes"].get("appStoreState")
          print(f"Version state after attach: {refreshed_state}")
          if refreshed_state == PENDING_RELEASE:
              restore_previous_build("Apple kept the version in PENDING_DEVELOPER_RELEASE after direct build replacement")
          if refreshed_state not in READY_TO_SUBMIT:
              restore_previous_build(f"Version is not submittable after build replacement: {refreshed_state}")

          review_payload = api(
              "GET",
              f"/reviewSubmissions?filter[app]={app_id}&filter[platform]=IOS&include=items",
          )
          submissions = review_payload.get("data", [])
          open_rows = [
              row for row in submissions
              if row.get("attributes", {}).get("state") in {
                  "READY_FOR_REVIEW", "WAITING_FOR_REVIEW", "IN_REVIEW", "COMPLETING", "UNRESOLVED_ISSUES"
              }
          ]
          if open_rows:
              for row in open_rows:
                  print(f"Open review submission: {row['id']} state={row.get('attributes', {}).get('state')}")
              sys.exit("Open review submission exists; refusing to create duplicate")

          created = json_api(
              "POST",
              "/reviewSubmissions",
              {
                  "data": {
                      "type": "reviewSubmissions",
                      "attributes": {"platform": "IOS"},
                      "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                  }
              },
              expected=(201,),
          )
          submission_id = created["data"]["id"]
          print(f"Created ReviewSubmission: {submission_id}")

          json_api(
              "POST",
              "/reviewSubmissionItems",
              {
                  "data": {
                      "type": "reviewSubmissionItems",
                      "relationships": {
                          "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": submission_id}},
                          "appStoreVersion": {"data": {"type": "appStoreVersions", "id": version_id}},
                      },
                  }
              },
              expected=(201,),
          )
          print("Attached app version item.")

          submitted = json_api(
              "PATCH",
              f"/reviewSubmissions/{submission_id}",
              {
                  "data": {
                      "type": "reviewSubmissions",
                      "id": submission_id,
                      "attributes": {"submitted": True},
                  }
              },
          )
          final_state = submitted["data"]["attributes"].get("state")
          print(f"Submitted ReviewSubmission: {submission_id} state={final_state}")
          if final_state not in {"WAITING_FOR_REVIEW", "IN_REVIEW"}:
              sys.exit(f"Unexpected final submission state: {final_state}")
          PY
