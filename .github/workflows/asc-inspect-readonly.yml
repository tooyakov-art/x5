name: ASC recover signed Apple purchase

on:
  workflow_dispatch: {}

concurrency:
  group: x5-dossymkhan-apple-purchase-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BUNDLE_ID: com.x5studio.app
      TARGET_APP_ACCOUNT_TOKEN: f4e32ce0-ca32-45ad-a63e-cc3b4a526881
      HISTORY_START_MS: "1784553300000"
      HISTORY_END_MS: "1784556900000"
      APP_STORE_NOTIFICATIONS_URL: https://afwznqjpshybmqhlewmy.supabase.co/functions/v1/app-store-notifications
      # Prefer the dedicated In-App Purchase integration key. The ASC fallback
      # only preserves compatibility with the repository's existing secret
      # names and will fail closed if Apple does not authorize it for this API.
      IAP_API_KEY_ID: ${{ secrets.IAP_API_KEY_ID || secrets.ASC_API_KEY_ID }}
      IAP_API_ISSUER_ID: ${{ secrets.IAP_API_ISSUER_ID || secrets.ASC_API_ISSUER_ID }}
      IAP_API_KEY_BASE64: ${{ secrets.IAP_API_KEY_BASE64 || secrets.ASC_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyjwt[crypto] requests
      - name: Verify narrow recovery matcher
        run: python -m unittest scripts.tests.test_apple_notification_replay
      - name: Replay exact signed Apple notification
        run: python scripts/apple_notification_replay.py
