name: ASC inspect readonly

on:
  push:
    branches: [restore-native-ui]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_ID: com.x5studio.app
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyjwt[crypto] requests

      - name: Inspect App Store Connect state
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import time
          from urllib.parse import urlparse

          import jwt
          import requests

          base = "https://api.appstoreconnect.apple.com/v1"

          def token():
              return jwt.encode(
                  {
                      "iss": os.environ["ASC_API_ISSUER_ID"],
                      "iat": int(time.time()),
                      "exp": int(time.time()) + 60 * 5,
                      "aud": "appstoreconnect-v1",
                  },
                  base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
                  algorithm="ES256",
                  headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
              )

          def get(path, **params):
              url = path if path.startswith("http") else f"{base}{path}"
              response = requests.get(url, headers={"Authorization": f"Bearer {token()}"}, params=params or None)
              print(f"GET {urlparse(url).path} -> {response.status_code}")
              if response.status_code >= 300:
                  print(response.text[:2000])
                  return {}
              return response.json()

          def dump(title, payload):
              print(f"\n=== {title} ===")
              print(json.dumps(payload, ensure_ascii=False, indent=2)[:12000])

          app_payload = get("/apps", **{"filter[bundleId]": os.environ["BUNDLE_ID"]})
          apps = app_payload.get("data", [])
          dump("apps", app_payload)
          if not apps:
              raise SystemExit("No app found")
          app_id = apps[0]["id"]

          versions_payload = get(
              f"/apps/{app_id}/appStoreVersions",
              include="build,appStoreVersionLocalizations,appStoreReviewDetail",
              limit=20,
          )
          dump("appStoreVersions", versions_payload)

          submissions_payload = get(
              "/reviewSubmissions",
              **{
                  "filter[app]": app_id,
                  "filter[platform]": "IOS",
                  "include": "items",
                  "limit": 20,
              },
          )
          dump("reviewSubmissions", submissions_payload)

          builds_payload = get(
              "/builds",
              **{
                  "filter[app]": app_id,
                  "filter[preReleaseVersion.platform]": "IOS",
                  "sort": "-uploadedDate",
                  "limit": 20,
              },
          )
          dump("builds", builds_payload)

          for version in versions_payload.get("data", []):
              attrs = version.get("attributes", {})
              if attrs.get("platform") != "IOS":
                  continue
              version_id = version["id"]
              version_string = attrs.get("versionString")
              print(f"\n### Version {version_string} ({version_id}) state={attrs.get('appStoreState')} ###")

              loc_payload = get(f"/appStoreVersions/{version_id}/appStoreVersionLocalizations", limit=20)
              dump(f"localizations {version_string}", loc_payload)

              review_payload = get(f"/appStoreVersions/{version_id}/appStoreReviewDetail")
              dump(f"review detail {version_string}", review_payload)

              for loc in loc_payload.get("data", []):
                  loc_id = loc["id"]
                  locale = loc.get("attributes", {}).get("locale")
                  sets_payload = get(
                      f"/appStoreVersionLocalizations/{loc_id}/appScreenshotSets",
                      include="appScreenshots",
                      limit=50,
                  )
                  dump(f"screenshot sets {version_string} {locale}", sets_payload)
          PY
