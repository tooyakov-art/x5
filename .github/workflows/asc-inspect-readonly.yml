name: ASC inspect readonly

on:
  push:
    branches: [restore-native-ui]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_ID: com.x5studio.app
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyjwt[crypto] requests

      - name: Inspect App Store Connect state
        run: |
          python <<'PY'
          import base64
          import json
          import os
          import time
          from urllib.parse import urlparse

          import jwt
          import requests

          base = "https://api.appstoreconnect.apple.com/v1"

          def token():
              return jwt.encode(
                  {
                      "iss": os.environ["ASC_API_ISSUER_ID"],
                      "iat": int(time.time()),
                      "exp": int(time.time()) + 60 * 5,
                      "aud": "appstoreconnect-v1",
                  },
                  base64.b64decode(os.environ["ASC_API_KEY_BASE64"]),
                  algorithm="ES256",
                  headers={"kid": os.environ["ASC_API_KEY_ID"], "typ": "JWT"},
              )

          def get(path, **params):
              url = path if path.startswith("http") else f"{base}{path}"
              response = requests.get(url, headers={"Authorization": f"Bearer {token()}"}, params=params or None)
              print(f"GET {urlparse(url).path} -> {response.status_code}")
              if response.status_code >= 300:
                  print(response.text[:2000])
                  return {}
              return response.json()

          app_payload = get("/apps", **{"filter[bundleId]": os.environ["BUNDLE_ID"]})
          apps = app_payload.get("data", [])
          if not apps:
              raise SystemExit("No app found")
          app_id = apps[0]["id"]
          app_attrs = apps[0]["attributes"]
          print(f"APP id={app_id} name={app_attrs.get('name')} bundle={app_attrs.get('bundleId')} primaryLocale={app_attrs.get('primaryLocale')}")

          versions_payload = get(
              f"/apps/{app_id}/appStoreVersions",
              include="build,appStoreVersionLocalizations,appStoreReviewDetail",
              limit=20,
          )
          print("\nVERSIONS")
          included = {(i["type"], i["id"]): i for i in versions_payload.get("included", [])}
          for version in versions_payload.get("data", []):
              attrs = version["attributes"]
              build_ref = version.get("relationships", {}).get("build", {}).get("data")
              build = included.get((build_ref["type"], build_ref["id"])) if build_ref else None
              print(
                  f"- {attrs.get('versionString')} platform={attrs.get('platform')} "
                  f"state={attrs.get('appStoreState')} "
                  f"reviewType={attrs.get('appStoreReviewType')} "
                  f"build={build.get('attributes', {}).get('version') if build else None}"
              )

          submissions_payload = get(
              "/reviewSubmissions",
              **{
                  "filter[app]": app_id,
                  "filter[platform]": "IOS",
                  "include": "items",
                  "limit": 20,
              },
          )
          print("\nREVIEW SUBMISSIONS")
          included_items = {(i["type"], i["id"]): i for i in submissions_payload.get("included", [])}
          for submission in submissions_payload.get("data", []):
              attrs = submission["attributes"]
              item_refs = submission.get("relationships", {}).get("items", {}).get("data", []) or []
              item_states = []
              for ref in item_refs:
                  item = included_items.get((ref["type"], ref["id"]))
                  item_states.append(f"{ref['type']}:{item.get('attributes', {}).get('state') if item else '?'}")
              print(f"- id={submission['id']} state={attrs.get('state')} submittedDate={attrs.get('submittedDate')} items={item_states}")

          builds_payload = get(
              "/builds",
              **{
                  "filter[app]": app_id,
                  "filter[preReleaseVersion.platform]": "IOS",
                  "sort": "-uploadedDate",
                  "limit": 20,
              },
          )
          print("\nBUILDS")
          for build in builds_payload.get("data", []):
              attrs = build["attributes"]
              print(
                  f"- build={attrs.get('version')} processing={attrs.get('processingState')} "
                  f"expired={attrs.get('expired')} uploaded={attrs.get('uploadedDate')} "
                  f"usesNonExemptEncryption={attrs.get('usesNonExemptEncryption')}"
              )

          for version in versions_payload.get("data", []):
              attrs = version.get("attributes", {})
              if attrs.get("platform") != "IOS" or attrs.get("versionString") != "1.1.1":
                  continue
              version_id = version["id"]
              version_string = attrs.get("versionString")
              print(f"\n### Version {version_string} ({version_id}) state={attrs.get('appStoreState')} ###")

              loc_payload = get(f"/appStoreVersions/{version_id}/appStoreVersionLocalizations", limit=20)
              print("\nLOCALIZATIONS")
              for loc in loc_payload.get("data", []):
                  a = loc["attributes"]
                  print(f"- locale={a.get('locale')}")
                  print(f"  description={a.get('description')}")
                  print(f"  keywords={a.get('keywords')}")
                  print(f"  marketingUrl={a.get('marketingUrl')}")
                  print(f"  promotionalText={a.get('promotionalText')}")
                  print(f"  supportUrl={a.get('supportUrl')}")
                  print(f"  whatsNew={a.get('whatsNew')}")

              review_payload = get(f"/appStoreVersions/{version_id}/appStoreReviewDetail")
              print("\nREVIEW DETAIL")
              review_attrs = review_payload.get("data", {}).get("attributes", {})
              for key in [
                  "contactFirstName",
                  "contactLastName",
                  "contactPhone",
                  "contactEmail",
                  "demoAccountName",
                  "demoAccountPassword",
                  "demoAccountRequired",
                  "notes",
              ]:
                  print(f"- {key}={review_attrs.get(key)}")

              for loc in loc_payload.get("data", []):
                  loc_id = loc["id"]
                  locale = loc.get("attributes", {}).get("locale")
                  sets_payload = get(
                      f"/appStoreVersionLocalizations/{loc_id}/appScreenshotSets",
                      include="appScreenshots",
                      limit=50,
                  )
                  print(f"\nSCREENSHOTS {version_string} {locale}")
                  for screenshot_set in sets_payload.get("data", []):
                      set_attrs = screenshot_set["attributes"]
                      refs = screenshot_set.get("relationships", {}).get("appScreenshots", {}).get("data", [])
                      print(f"- set={set_attrs.get('screenshotDisplayType')} total={len(refs)}")
                  for item in sets_payload.get("included", []):
                      a = item["attributes"]
                      print(
                          f"  file={a.get('fileName')} size={a.get('fileSize')} "
                          f"state={a.get('assetDeliveryState', {}).get('state')} "
                          f"{a.get('imageAsset', {}).get('width')}x{a.get('imageAsset', {}).get('height')}"
                      )
          PY
